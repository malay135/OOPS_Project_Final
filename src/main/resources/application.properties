spring.application.name=i-itsm

# Every ${NAME:value} below can be changed on the cloud server with an environment variable called NAME.
# The part after the ':' is the default that our laptops use, so running locally works exactly as before.

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itsm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:malay@sql}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# Email notifications through Brevo. Left empty on laptops: emails are then only printed to the console.
app.mail.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:I-ITSM Service Desk}

# Address of the website (the Netlify site on the cloud). Used for the "Open it" link inside emails,
# and the backend accepts changes (POST/PUT) coming from this website (CORS).
app.url=${APP_URL:http://localhost:5173}
